[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "captain-core"
version = "0.1.0"
description = "Shared project discovery and manifest infrastructure for the Captain tool ecosystem."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Billy Bissic" }]
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=5.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
